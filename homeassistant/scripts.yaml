# ─── Media System Scripts ─────────────────────────────────────────────────────
# TV power: discrete IR on/off via Broadlink (always works, even when TV WiFi is asleep)
# TV state: read from Cast (media_player.65oled865_12) — accurate when TV is on
# MXN10: native Cambridge Audio integration (media_player.mxn10_2e_2)
# IR: Broadlink for TV, home cinema amp, and audio switch

# ── IR Code Reference ────────────────────────────────────────────────────────
# TV power on:       discrete ON (not toggle)
# TV power off:      discrete OFF (not toggle)
# Home cinema on:    discrete ON
# Home cinema off:   discrete OFF
# Cinema volume up:  volume +
# Cinema volume down: volume -
# Cinema display dim: front-panel brightness (cycles full → dim → off)
# Audio switch → TV:       switch to TV/cinema input
# Audio switch → streamer: switch to MXN10/music input

# ── Activate Audio Mode ──────────────────────────────────────────────────────
activate_audio_mode:
  mode: restart
  alias: "Activate Audio Mode"
  icon: mdi:music
  description: "Power on MXN10 streamer, switch audio to streamer input. If coming from Cinema, turn off TV and home cinema amp."
  sequence:
    # If coming from Cinema mode, turn off cinema gear
    - if:
        - condition: state
          entity_id: input_select.media_system_mode
          state: "Cinema"
      then:
        # Snapshot what's on screen, then turn off TV via discrete IR off
        - action: shell_command.tv_save_activity
          continue_on_error: true
        - action: shell_command.tv_power_off
          continue_on_error: true
        - delay: 0.5
        # Turn off home cinema amp via discrete IR off
        - action: remote.send_command
          target:
            entity_id: remote.ir_universal_remote_hub
          data:
            command: "b64:JgBIAAABHY8REhATERMREhESERMQFBE1ERISEhETEBMRNhE1ETcREhA3EDYRNxA2ETYRExATETYQExESERQQExATEDcQNhETEgANBQ=="
        - delay: 0.5
    # Power on MXN10
    - action: rest_command.mxn10_power_on
    - delay: 3
    # Switch audio to streamer input
    - action: remote.send_command
      target:
        entity_id: remote.ir_universal_remote_hub
      data:
        command: "b64:JgBYAAABHZEREhISEhISEhISERITEhI1EjYSNhI2EjYSNRI2EjYSEhI2ETcREhI3ETYTERISEhIRExISEjUTEhESEjcRNhI2EgAE6QABHkgSAAvuAAEdSRIADQU="
    # Update state
    - service: input_select.select_option
      data:
        entity_id: input_select.media_system_mode
        option: Audio

    # Blue = "Audio mode" indicator — but only for 10s. Snapshot whatever
    # ambient look the lamp already had (including off) so we can put it
    # back instead of permanently overriding it.
    - action: scene.create
      data:
        scene_id: audio_mode_lamp_restore
        snapshot_entities:
          - light.hue_color_lamp_2
    - action: light.turn_on
      target:
        entity_id: light.hue_color_lamp_2
      data:
        brightness_pct: 25
        xy_color: [0.13, 0.13]
    - delay:
        seconds: 10
    # Only restore if we're still in Audio mode — if the mode changed in the
    # meantime, that mode's own lamp state (or a later restore) already owns
    # the lamp, and this would clobber it.
    - if:
        - condition: state
          entity_id: input_select.media_system_mode
          state: "Audio"
      then:
        - action: scene.turn_on
          target:
            entity_id: scene.audio_mode_lamp_restore
# ── Activate Cinema Mode ─────────────────────────────────────────────────────
activate_cinema_mode:
  mode: restart
  alias: "Activate Cinema Mode"
  icon: mdi:filmstrip
  description: "Power-cycle MXN10 to wake home cinema amp, turn on TV via IR, switch audio to TV input."
  sequence:
    # Mode + lamp first: instant ack, and the next ON press (resume) must
    # already see Cinema even while the ~15s startup below is still running.
    - service: input_select.select_option
      data:
        entity_id: input_select.media_system_mode
        option: Cinema
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.cinema_resume_used
    - action: light.turn_on
      target:
        entity_id: light.hue_color_lamp_2
      data:
        brightness_pct: 25
        color_temp_kelvin: 2500
    # Power-cycle MXN10 (off then on) to wake the amp via trigger
    - action: rest_command.mxn10_power_off
    - delay: 2
    - action: rest_command.mxn10_power_on
    - delay: 3
    # Turn on TV via discrete IR on (works even when TV WiFi is asleep)
    - action: script.tv_wake
    - delay: 3
    # Turn on home cinema amp via discrete IR on
    - action: remote.send_command
      target:
        entity_id: remote.ir_universal_remote_hub
      data:
        command: "b64:JgBUAAQABhoAAR2PERIRGQsTERIRExETERIRNxESERMRExESETYSNhE3ERIRExA3ERMQNxETERIRNxE2EjURExE3EBMQOBE2EBQREhEABYQAAR1JEQANBQ=="
    - delay: 0.5
    # Switch audio to TV input
    - action: remote.send_command
      target:
        entity_id: remote.ir_universal_remote_hub
      data:
        command: "b64:JgBIAAABHo8SEhISEhISERMSEhIREhI3ETYTNRI2EjYRNxI2EjYREhMSEjUSExE2EjYSEhISEhISNRMSEjUSExISETYTNRI2EgANBQ=="
    - delay: 1
    # Black out the amp's front panel — default look for Cinema viewing
    - action: script.cinema_display_dim
      continue_on_error: true
    # Last, so its polling doesn't hold up the amp/switch IR steps above
    - action: shell_command.tv_clear_nag
      continue_on_error: true
# ── Cinema: Dim Amp Display ──────────────────────────────────────────────────
# The Harman's front-panel brightness cycles full → dim → off on each press of
# the remote's dim button, so two presses land on "off" (black). That's the
# default viewing state for Cinema mode. Safe to run standalone if the panel
# wakes up mid-film (it just cycles back around to black in three presses).
cinema_display_dim:
  mode: restart
  alias: "Cinema: Dim Amp Display"
  icon: mdi:brightness-4
  description: "Send the home cinema amp display-dim IR twice so the front panel goes black."
  sequence:
    - repeat:
        count: 2
        sequence:
          - action: remote.send_command
            target:
              entity_id: remote.ir_universal_remote_hub
            data:
              command: "b64:JgBoAAABG48RExATERMREhESERISExA2EBMSEhATEBMRNxE1EDcRExATEBQQNhE2ETYREhI1EDgQNhE2EBMQExETEDcREhATEgAFiwABHEgRAAvrAAEbSRAAC+kAARxJEAAL6wABHEgRAA0F"
          - delay: 0.5

# ── System Off ────────────────────────────────────────────────────────────────
media_system_off:
  mode: restart
  alias: "Media System Off"
  icon: mdi:power
  description: "Turn everything off. Discrete IR off commands — safe to repeat."
  sequence:
    # Snapshot whatever ambient lighting the lamp is showing *before* we touch
    # it — same reasoning as Audio mode's blue indicator: this lamp doubles as
    # room ambience, and turning the media system off shouldn't leave it stuck
    # off. Must run first, before the lamp is touched at all.
    - action: scene.create
      data:
        scene_id: off_mode_lamp_restore
        snapshot_entities:
          - light.hue_color_lamp_2
    # Off indicator — instant ack, before the slower mxn10/IR/TV shell steps.
    - action: light.turn_off
      target:
        entity_id: light.hue_color_lamp_2
    # Always turn off MXN10
    - action: rest_command.mxn10_power_off
    # Always turn off home cinema amp (discrete IR off)
    - action: remote.send_command
      target:
        entity_id: remote.ir_universal_remote_hub
      data:
        command: "b64:JgBIAAABHY8REhATERMREhESERMQFBE1ERISEhETEBMRNhE1ETcREhA3EDYRNxA2ETYRExATETYQExESERQQExATEDcQNhETEgANBQ=="
    - delay: 0.5
    # Snapshot what's on screen before killing power (best-effort — TV may
    # already be off, in which case this is a harmless no-op)
    - action: shell_command.tv_save_activity
      continue_on_error: true
    # Turn off TV via discrete IR off (always safe to send)
    - action: shell_command.tv_power_off
      continue_on_error: true
    # Reset mode
    - service: input_select.select_option
      data:
        entity_id: input_select.media_system_mode
        option: "Off"

    - delay:
        seconds: 10
    # Only restore if we're still Off — if another mode press came in during
    # the wait, that mode's own lamp state already owns the lamp.
    - if:
        - condition: state
          entity_id: input_select.media_system_mode
          state: "Off"
      then:
        - action: scene.turn_on
          target:
            entity_id: scene.off_mode_lamp_restore
# ── Toggle TV (long-press override) ──────────────────────────────────────────
toggle_tv:
  mode: restart
  alias: "Toggle TV"
  icon: mdi:television
  description: "Toggle TV on/off using discrete IR codes based on Cast state."
  sequence:
    - if:
        - condition: template
          value_template: "{{ states('media_player.65oled865_12') in ['off', 'unavailable', 'unknown'] }}"
      then:
        # TV is off → discrete IR on
        - action: script.tv_wake
        - action: shell_command.tv_clear_nag
          continue_on_error: true
      else:
        # TV is on → save what's showing, then discrete IR off
        - action: shell_command.tv_save_activity
          continue_on_error: true
        - action: shell_command.tv_power_off
          continue_on_error: true
# ── Volume Up (Tap — short press) ────────────────────────────────────────────
media_volume_up_tap:
  alias: "Media Volume Up (Tap)"
  icon: mdi:volume-plus
  description: "Short press volume up — MXN10 +3 steps in Audio, 1 IR pulse in Cinema."
  sequence:
    - choose:
        - conditions:
            - condition: state
              entity_id: input_select.media_system_mode
              state: "Audio"
          sequence:
            - repeat:
                count: 3
                sequence:
                  - action: rest_command.mxn10_volume_up
        - conditions:
            - condition: state
              entity_id: input_select.media_system_mode
              state: "Cinema"
          sequence:
            - action: remote.send_command
              target:
                entity_id: remote.ir_universal_remote_hub
              data:
                command: "b64:JgCIAAABHZAQExESERMRExESERMQFBE2ERMREhETERIRNxE3ETYQExI2EDcRNhEUEBMREhE3ETYRExESERMRNxA2ETcRExAUEQAFgwABHkcSAAvsAAEcSREAC+wAAR1IEQAL7QABHEkRAAvsAAEcSREAC+wAAR1IEQAL7QABHEkRAAvsAAEcSREADQU="

# ── Volume Up (Hold — repeat events) ─────────────────────────────────────────
media_volume_up_hold:
  alias: "Media Volume Up (Hold)"
  icon: mdi:volume-plus
  mode: single
  description: "Hold volume up — MXN10 +1 step in Audio, 1 IR pulse in Cinema."
  sequence:
    - choose:
        - conditions:
            - condition: state
              entity_id: input_select.media_system_mode
              state: "Audio"
          sequence:
            - action: rest_command.mxn10_volume_up
        - conditions:
            - condition: state
              entity_id: input_select.media_system_mode
              state: "Cinema"
          sequence:
            - action: remote.send_command
              target:
                entity_id: remote.ir_universal_remote_hub
              data:
                command: "b64:JgCIAAABHZAQExESERMRExESERMQFBE2ERMREhETERIRNxE3ETYQExI2EDcRNhEUEBMREhE3ETYRExESERMRNxA2ETcRExAUEQAFgwABHkcSAAvsAAEcSREAC+wAAR1IEQAL7QABHEkRAAvsAAEcSREAC+wAAR1IEQAL7QABHEkRAAvsAAEcSREADQU="

# ── Volume Down (Tap — short press) ──────────────────────────────────────────
media_volume_down_tap:
  alias: "Media Volume Down (Tap)"
  icon: mdi:volume-minus
  description: "Short press volume down — MXN10 -3 steps in Audio, 1 IR pulse in Cinema."
  sequence:
    - choose:
        - conditions:
            - condition: state
              entity_id: input_select.media_system_mode
              state: "Audio"
          sequence:
            - repeat:
                count: 3
                sequence:
                  - action: rest_command.mxn10_volume_down
        - conditions:
            - condition: state
              entity_id: input_select.media_system_mode
              state: "Cinema"
          sequence:
            - action: remote.send_command
              target:
                entity_id: remote.ir_universal_remote_hub
              data:
                command: "b64:JgCoAAABHo8REhETERMREhETEBQREhE2ERMRExESERISNhE3ETYREhITEBMREhE3ERIRExI1ETcRNhE3EDcQFBE2EDcRExESEQAFhAABHUgSAAvqAAEdSREAC+oAAR1JEQAL6gABHUkQAAvrAAEdSRAAC+sAAR1IEQAL6wABHkgQAAvsAAEcSBEAC+sAAR1JEQAL6gABHUkRAAvqAAEdSREAC+oAAR1JEQANBQ=="

# ── Volume Down (Hold — repeat events) ───────────────────────────────────────
media_volume_down_hold:
  alias: "Media Volume Down (Hold)"
  icon: mdi:volume-minus
  mode: single
  description: "Hold volume down — MXN10 -1 step in Audio, 1 IR pulse in Cinema."
  sequence:
    - choose:
        - conditions:
            - condition: state
              entity_id: input_select.media_system_mode
              state: "Audio"
          sequence:
            - action: rest_command.mxn10_volume_down
        - conditions:
            - condition: state
              entity_id: input_select.media_system_mode
              state: "Cinema"
          sequence:
            - action: remote.send_command
              target:
                entity_id: remote.ir_universal_remote_hub
              data:
                command: "b64:JgCoAAABHo8REhETERMREhETEBQREhE2ERMRExESERISNhE3ETYREhITEBMREhE3ERIRExI1ETcRNhE3EDcQFBE2EDcRExESEQAFhAABHUgSAAvqAAEdSREAC+oAAR1JEQAL6gABHUkQAAvrAAEdSRAAC+sAAR1IEQAL6wABHkgQAAvsAAEcSBEAC+sAAR1JEQAL6gABHUkRAAvqAAEdSREAC+oAAR1JEQANBQ=="

# ── Toggle Mode (short-press ON) ─────────────────────────────────────────────
toggle_media_mode:
  mode: restart
  alias: "Toggle Media Mode"
  icon: mdi:swap-horizontal
  description: "Cycle through Off → Audio → Cinema → (3rd press) resume last program, then back to Audio."
  # Everything below is fire-and-forget (script.turn_on) so this — and the
  # single-mode dimmer automation that calls it — returns instantly. Awaiting
  # the ~30s Cinema startup made the automation drop presses as "already
  # running", which is why the resume press was hit and miss.
  sequence:
    - choose:
        - conditions:
            - condition: state
              entity_id: input_select.media_system_mode
              state: "Off"
          sequence:
            - action: script.turn_on
              target:
                entity_id: script.activate_audio_mode
        - conditions:
            - condition: state
              entity_id: input_select.media_system_mode
              state: "Audio"
          sequence:
            - action: script.turn_on
              target:
                entity_id: script.activate_cinema_mode
        # 3rd press: first time back at Cinema this session → offer resume
        # instead of cycling away, then mark it used.
        - conditions:
            - condition: and
              conditions:
                - condition: state
                  entity_id: input_select.media_system_mode
                  state: "Cinema"
                - condition: state
                  entity_id: input_boolean.cinema_resume_used
                  state: "off"
          sequence:
            - action: input_boolean.turn_on
              target:
                entity_id: input_boolean.cinema_resume_used
            - action: script.turn_on
              target:
                entity_id: script.resume_tv_program
        # 4th+ press while still in Cinema (resume already offered) → back to Audio
        - conditions:
            - condition: state
              entity_id: input_select.media_system_mode
              state: "Cinema"
          sequence:
            # Nothing awaits these any more, so stop them explicitly rather
            # than letting a half-finished Cinema startup fight Audio mode.
            - action: script.turn_off
              target:
                entity_id:
                  - script.activate_cinema_mode
                  - script.resume_tv_program
            - action: script.turn_on
              target:
                entity_id: script.activate_audio_mode

# ── TV wake helper (WoL → wait → API On) ─────────────────────────────────────
# Philips Android TVs drop to deep standby a few seconds after power-off; the
# API stops responding. A WoL magic packet wakes the network stack
# (state goes to "StandbyKeep"), then POST powerstate=On turns the panel on.
tv_wake:
  mode: restart
  alias: "TV: Wake + Power On"
  icon: mdi:television
  description: "Wake-on-LAN to the TV MAC, brief settle delay, then POST powerstate=On."
  sequence:
    - action: wake_on_lan.send_magic_packet
      data:
        mac: "<TV_MAC_ADDRESS>"
        broadcast_address: "<LAN_BROADCAST_ADDRESS>"
    - delay:
        milliseconds: 1500
    - action: shell_command.tv_power_on
      continue_on_error: true

# ── Resume Last TV Program ───────────────────────────────────────────────────
# Relaunches whatever app/activity (including the built-in live TV tuner) was
# on screen the last time the TV was turned off, via tv_save_activity /
# tv_resume_activity (see homeassistant/tv_resume.sh).
resume_tv_program:
  mode: restart
  alias: "TV: Resume Last Program"
  icon: mdi:play-circle
  description: "Wake the TV if needed, then relaunch whatever was on screen when it was last turned off (clearing the consent nag if it appears)."
  sequence:
    # Instant "got it" — the relaunch itself can take 10-30s after a wake.
    - action: light.turn_on
      target:
        entity_id: light.hue_color_lamp_2
      data:
        flash: short
      continue_on_error: true
    # Always wake: the Cast media_player lags real TV state by a minute or
    # more, and WoL + power-On is a no-op on a TV that's already on.
    # tv_resume.sh then waits until the TV really reports On before launching.
    - action: script.tv_wake
      continue_on_error: true
    - action: shell_command.tv_resume_activity
      continue_on_error: true
